<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kidzonia International Pre-School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
/* registered so they can be transitioned / animated */
@property --route  { syntax:'<color>'; inherits:true;  initial-value:#E62C60 }
@property --preview{ syntax:'<color>'; inherits:true;  initial-value:#E62C60 }
@property --spin   { syntax:'<angle>'; inherits:false; initial-value:0deg }

:root{
  /* sampled straight from the Kidzonia logo */
  --pink:#E62C60;
  --orange:#E8761E;
  --green:#519F3C;
  --teal:#16A290;
  --sky:#65C6EB;
  --sky-deep:#1D8CBE;
  --yellow:#E9B408;
  --coral:#E15250;

  --ink:#2B2233;
  --ink-soft:#6E6478;
  --wash:#FFF6F8;
  --card:#FFFFFF;
  --route:#E62C60;
  --preview:#E62C60;

  --display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --body:"Nunito Sans",ui-sans-serif,system-ui,sans-serif;
}
/* only --preview glides; --route stays instant so the tunnel never lags behind */
html{transition:--preview 340ms ease}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--wash);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
img,svg{display:block;max-width:100%}

/* ================= GREETER ================= */
#greeter{
  position:fixed; inset:0; z-index:40;
  /* the video keeps its true shape at full width; any extra height scrolls */
  overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column;
  background:#000;
}
/* the only full-bleed layer that repaints when the destination tint changes */
#tint{
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(84% 62% at 50% -8%, color-mix(in srgb, var(--preview) 18%, transparent) 0%, transparent 64%),
    radial-gradient(60% 45% at 50% 108%, color-mix(in srgb, var(--preview) 12%, transparent) 0%, transparent 60%);
}
#spot{
  position:absolute; top:0; left:0;
  width:64vmax; height:64vmax; margin:-32vmax 0 0 -32vmax;
  pointer-events:none; will-change:transform;
  background:radial-gradient(circle at 50% 50%,
    color-mix(in srgb, var(--preview) 22%, transparent) 0%, transparent 60%);
}
/* intro video fills the greeter; the question only arrives once it has played out */
#intro{
  display:block; flex:none; width:100%; height:auto;
  margin-block:auto;          /* centred when shorter than the screen, scrollable when taller */
  background:#000;
}
#sound{
  position:fixed; right:clamp(12px,3vw,28px); bottom:clamp(12px,3vw,28px); z-index:3;
  display:none; align-items:center; gap:.5em;
  font-family:var(--display); font-weight:600; font-size:.9rem;
  color:#fff; background:rgba(20,14,26,.6); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.3); border-radius:999px;
  padding:.6em 1.1em; cursor:pointer;
}
#sound.on{display:inline-flex}
/* temporary: compare the two intro cuts */
#vpick{
  position:fixed; right:clamp(12px,3vw,28px); top:clamp(12px,3vw,28px); z-index:4;
  display:flex; gap:2px; padding:3px; border-radius:999px;
  background:rgba(20,14,26,.6); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.3);
}
#vpick button{
  font-family:var(--display); font-weight:600; font-size:.85rem; color:#fff;
  background:none; border:0; border-radius:999px; padding:.5em 1em; cursor:pointer;
}
#vpick button[aria-pressed="true"]{background:#fff; color:#241F33}
#sound:hover{background:rgba(20,14,26,.8)}
#scrim{
  position:fixed; inset:0; pointer-events:none; opacity:0;
  background:radial-gradient(90% 70% at 50% 50%, rgba(20,14,26,.55) 0%, rgba(20,14,26,.25) 70%, rgba(20,14,26,.1) 100%);
  transition:opacity 700ms ease;
}
#greeter.ready #scrim{opacity:1}
#greeter .blobs,#greeter .confetti,#tint,#spot{display:none}
#greeter:not(.ready) .greeter-inner{visibility:hidden}
.blobs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blobs i{
  position:absolute; display:block; border-radius:50%;
  filter:blur(60px);        /* per-blob, so each blur is cached in its own layer */
  will-change:transform;    /* drift stays compositor-only and never re-blurs */
}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti span{position:absolute;border-radius:50%;opacity:.10;will-change:transform}

.greeter-inner{
  /* pinned to the screen so the question stays centred however far the video is scrolled */
  position:fixed; inset:0; z-index:2; padding:4vmin 5vw;
  display:grid; place-content:center; justify-items:center; gap:clamp(1.1rem,3vw,1.7rem);
  pointer-events:none;
}
.greeter-inner > *{pointer-events:auto}
.mark{width:clamp(132px,20vw,176px);height:auto}

.meet{
  display:flex; align-items:center; justify-content:center;
  gap:clamp(1rem,3.5vw,2.2rem); flex-wrap:wrap;
}
.portrait-wrap{position:relative;flex:none;text-align:center}
.portrait{
  width:clamp(116px,20vmin,166px); height:clamp(116px,20vmin,166px);
  border-radius:50%; object-fit:cover;
  background:conic-gradient(from var(--spin),var(--pink),var(--orange),var(--yellow),var(--green),var(--teal),var(--sky),var(--pink));
  padding:5px;
  box-shadow:0 14px 34px rgba(43,34,51,.16);
}
.who{
  margin-top:.65rem;
  font-family:var(--display); font-weight:700;
  font-size:clamp(.82rem,2.2vw,.92rem); line-height:1.25;
}
.who small{
  display:block; font-family:var(--body); font-weight:600;
  font-size:.72rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-soft); margin-top:.15rem;
}
.bubble{
  position:relative; text-align:left; max-width:30ch;
  background:var(--card);
  border-radius:22px 22px 22px 6px;
  padding:clamp(1rem,3vw,1.4rem) clamp(1.1rem,3.4vw,1.6rem);
  box-shadow:0 16px 40px rgba(43,34,51,.12), 0 2px 0 rgba(43,34,51,.05);
}
.bubble p{font-size:clamp(1rem,2.7vw,1.12rem)}
.bubble p+p{margin-top:.6em}
.bubble strong{font-family:var(--display);font-weight:700;color:var(--pink)}
.bubble::before{
  content:""; position:absolute; left:-9px; bottom:16px;
  width:20px;height:20px;background:var(--card);
  border-radius:0 0 0 6px; transform:rotate(45deg);
}

.ask{
  font-family:var(--display); font-weight:700;
  font-size:clamp(1.5rem,4.6vw,2.4rem); line-height:1.2;
  text-align:center; color:#fff;
  text-shadow:0 2px 18px rgba(0,0,0,.45);
}
.options{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(.45rem,1.5vw,.7rem);max-width:700px}
.chip{
  appearance:none; cursor:pointer;
  display:inline-flex; align-items:center; gap:.55em;
  font-family:var(--display); font-weight:600;
  font-size:clamp(.83rem,2.3vw,.95rem);
  color:var(--ink); background:var(--card);
  border:2px solid rgba(43,34,51,.10);
  border-radius:999px; padding:.7em 1.2em;
  box-shadow:0 6px 16px rgba(43,34,51,.08);
  transition:transform 170ms cubic-bezier(.2,.9,.3,1), box-shadow 170ms ease, border-color 170ms ease, color 170ms ease;
}
.chip .dot{width:.7em;height:.7em;border-radius:50%;background:var(--c);flex:none;transition:transform 170ms cubic-bezier(.2,.9,.3,1)}
.chip:hover,.chip:focus-visible{
  transform:translateY(-3px);
  border-color:var(--c); color:var(--c);
  box-shadow:0 12px 26px color-mix(in srgb, var(--c) 26%, transparent);
}
.chip:hover .dot,.chip:focus-visible .dot{transform:scale(1.35)}
.chip:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.chip:active{transform:translateY(0)}
.skip{
  background:none;border:0;cursor:pointer;font-family:var(--body);
  font-size:.9rem;color:rgba(255,255,255,.85);
  text-decoration:underline;text-underline-offset:4px;
  text-shadow:0 1px 8px rgba(0,0,0,.5);
}
.skip:hover{color:#fff}

/* ---- greeter entrance choreography ---- */
@keyframes rise    {from{opacity:0;transform:translateY(14px)}           to{opacity:1;transform:none}}
@keyframes pop     {from{opacity:0;transform:scale(.88)}                 to{opacity:1;transform:none}}
@keyframes bubblein{from{opacity:0;transform:scale(.82) translateY(10px)}to{opacity:1;transform:none}}
@keyframes chipin  {from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
@keyframes drift{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  33%    {transform:translate3d(5vw,-4vh,0) scale(1.14)}
  66%    {transform:translate3d(-4vw,5vh,0) scale(.9)}
}
@keyframes float{
  0%,100%{transform:translate3d(0,0,0)}
  25%    {transform:translate3d(2.4vw,-3.2vh,0)}
  50%    {transform:translate3d(-1.6vw,-6vh,0)}
  75%    {transform:translate3d(-3.2vw,-2.4vh,0)}
}
@keyframes spinring{to{--spin:360deg}}
@keyframes breathe {0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
@keyframes tumble  {to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: no-preference){
  .greeter-anim.ready .ask     {animation:rise     620ms cubic-bezier(.16,1,.3,1) 150ms both}
  .greeter-anim.ready .chip    {animation:chipin   520ms cubic-bezier(.16,1,.3,1) calc(320ms + var(--i) * 70ms) both}
  .greeter-anim.ready .skip    {animation:rise     500ms ease 760ms both}

  .blobs i      {animation-name:drift;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
  .confetti span{animation-name:float;animation-timing-function:linear;    animation-iteration-count:infinite}
  .portrait     {animation:spinring 18s linear infinite, breathe 6s ease-in-out infinite}
  #tunnel.live .toy > i{animation-play-state:running}
}
@media (prefers-reduced-motion: reduce){
  #spot{display:none}
}

/* ================= WORMHOLE ================= */
#tunnel{
  position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  perspective:clamp(420px,62vmin,900px);
  contain:layout paint style;
}
#tunnel.live{pointer-events:auto;cursor:pointer}
#roll{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.layer{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
/* Soft cloud puffs replace the old concentric bordered rings. Hard rings read as
   a sci-fi vortex; drifting through pastel cloud gives the same depth cue but
   stays soft and childlike. Built from radial-gradient rather than filter:blur so
   nothing has to re-blur while the perspective zoom rescales the layer. */
.puff{
  position:absolute; top:50%; left:50%; border-radius:50%;
  background:radial-gradient(circle at 50% 42%,
    rgba(255,255,255,.95) 0%, var(--pc) 44%, transparent 72%);
}
/* A soft glowing annulus, not a wireframe hoop. This is what carries the sense of
   travelling down something: the harsh bordered rings read as a sci-fi vortex, but
   the same structure rendered as diffuse light reads cinematic. */
.halo{
  position:absolute; top:50%; left:50%; border-radius:50%;
  background:radial-gradient(circle at 50% 50%,
    transparent 54%, var(--pc) 67%, transparent 86%);
}
/* out-of-focus colour bokeh - depth of field, the cinematic cue geometry was doing badly */
.bokeh{
  position:absolute; top:50%; left:50%; border-radius:50%;
  background:radial-gradient(circle at 50% 50%,
    var(--pc) 0%, color-mix(in srgb, var(--pc) 45%, transparent) 55%, transparent 74%);
}
.toy{position:absolute;top:50%;left:50%;width:76px;margin:-38px 0 0 -38px}
.toy > i{display:block;animation:tumble linear infinite;animation-play-state:paused}
.toy svg{width:100%;height:auto}

#streaks{position:absolute;inset:0;pointer-events:none;opacity:0;will-change:transform,opacity}
#streaks i{
  position:absolute; top:50%; left:50%; display:block;
  border-radius:999px; transform-origin:0 50%;
}
/* Square and centred, with closest-side sizing. With inset:0 the default
   farthest-corner gradient had not reached transparent by the top and bottom
   edges on a wide viewport, so the element box showed as a faint rectangle. */
#glow{
  position:absolute; top:50%; left:50%; translate:-50% -50%;
  width:150vmax; height:150vmax; opacity:0;
  background:radial-gradient(circle closest-side at 50% 50%,
    #fff 0%,
    color-mix(in srgb, var(--route) 40%, white) 15%,
    color-mix(in srgb, var(--route) 20%, transparent) 36%, transparent 64%);
  will-change:transform,opacity;
}
#bloom{
  position:absolute; top:50%; left:50%; translate:-50% -50%;
  width:min(520px,88vmin); aspect-ratio:1; opacity:0; border-radius:50%;
  background:radial-gradient(circle closest-side at 50% 50%,
    #fff 0%, rgba(255,255,255,.94) 18%,
    color-mix(in srgb, var(--route) 36%, white) 42%,
    color-mix(in srgb, var(--route) 20%, transparent) 64%, transparent 80%);
  will-change:transform,opacity;
}
#flash{
  position:absolute; top:50%; left:50%; translate:-50% -50%;
  width:min(260px,54vw); opacity:0; will-change:transform,opacity;
}
#vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%, transparent 54%,
    color-mix(in srgb, var(--wash) 30%, transparent) 94%);
}

/* ================= SITE ================= */
#site{position:relative;min-height:100vh;display:none;flex-direction:column}
#site.on{display:flex}
#stage{flex:1;display:flex;flex-direction:column;will-change:transform,opacity}

.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:clamp(.7rem,3vw,2rem);
  padding:.7rem clamp(1rem,5vw,3rem);
  background:rgba(255,255,255,.93); backdrop-filter:blur(10px);
  box-shadow:0 1px 0 rgba(43,34,51,.08);
}
.topbar .brandlogo{width:clamp(84px,13vw,116px);cursor:pointer}
.nav{display:flex;flex-wrap:wrap;gap:clamp(.5rem,1.8vw,1.4rem);margin-left:auto}
.nav button{
  appearance:none;background:none;border:0;cursor:pointer;
  font-family:var(--display);font-weight:600;
  font-size:clamp(.76rem,2vw,.9rem);color:var(--ink-soft);
  padding:.35em 0;border-bottom:3px solid transparent;
  transition:color 160ms ease,border-color 160ms ease;
}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--c);border-bottom-color:var(--c)}
.nav button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}

main{flex:1}
.hero{
  position:relative;overflow:hidden;
  padding:clamp(2.4rem,7vw,5rem) clamp(1.2rem,5vw,3rem) clamp(2rem,5vw,3.4rem);
  background:linear-gradient(180deg, color-mix(in srgb, var(--route) 13%, #fff) 0%, var(--wash) 100%);
}
.hero::after{
  content:"";position:absolute;right:-8vmin;top:-14vmin;
  width:44vmin;height:44vmin;border-radius:50%;
  background:color-mix(in srgb, var(--route) 12%, transparent);
}
.hero-inner{position:relative;z-index:1;max-width:820px;margin:0 auto}
.eyebrow{
  display:inline-flex;align-items:center;gap:.5em;
  font-family:var(--display);font-weight:700;
  font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--route);margin-bottom:.9rem;
}
.eyebrow::before{content:"";width:24px;height:4px;border-radius:2px;background:var(--route)}
.hero h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(1.95rem,6.6vw,3.3rem);line-height:1.05;letter-spacing:-.025em;
  text-wrap:balance;
}
.lede{margin-top:1rem;max-width:56ch;font-size:clamp(1rem,2.6vw,1.14rem);color:var(--ink-soft)}
.cta{
  display:inline-flex;align-items:center;gap:.5em;margin-top:1.7rem;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:.95rem;
  color:#fff;background:var(--route);border:0;border-radius:999px;
  padding:.85em 1.7em;
  box-shadow:0 10px 24px color-mix(in srgb, var(--route) 40%, transparent);
  transition:transform 170ms ease,box-shadow 170ms ease;
}
.cta:hover{transform:translateY(-3px);box-shadow:0 16px 32px color-mix(in srgb, var(--route) 46%, transparent)}
.cta:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.cards{
  max-width:1060px;margin:0 auto;
  padding:clamp(1.8rem,5vw,3.2rem) clamp(1.2rem,5vw,3rem) clamp(3rem,7vw,4.5rem);
  display:grid;gap:clamp(.9rem,2.4vw,1.35rem);
  grid-template-columns:repeat(auto-fit,minmax(238px,1fr));
}
.card{
  background:var(--card);border-radius:20px;
  padding:clamp(1.15rem,3vw,1.6rem);
  box-shadow:0 10px 30px rgba(43,34,51,.09);
  border-top:5px solid var(--route);
  transition:transform 200ms ease,box-shadow 200ms ease;
}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(43,34,51,.13)}
.card .tag{
  display:inline-block;margin-bottom:.6rem;
  font-family:var(--display);font-weight:700;font-size:.66rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--route);
}
.card h3{font-family:var(--display);font-weight:700;font-size:1.1rem;margin-bottom:.4rem}
.card p{font-size:.93rem;color:var(--ink-soft)}

footer{
  background:var(--ink);color:rgba(255,255,255,.75);
  padding:clamp(1.5rem,4vw,2.2rem) clamp(1.2rem,5vw,3rem);
  display:flex;flex-wrap:wrap;gap:.8rem 1.4rem;align-items:center;font-size:.82rem;
}
footer .redig{
  margin-left:auto;background:none;border:0;cursor:pointer;
  font-family:var(--body);font-size:.82rem;color:rgba(255,255,255,.75);
  text-decoration:underline;text-underline-offset:4px;
}
footer .redig:hover{color:#fff}
.sample{font-size:.7rem;color:rgba(255,255,255,.4);width:100%}

#helper{
  position:fixed;right:clamp(12px,3vw,26px);bottom:clamp(12px,3vw,26px);z-index:30;
  display:none;align-items:center;gap:.6rem;
  background:var(--card);border:0;border-radius:999px;
  padding:.4rem 1.1rem .4rem .45rem;cursor:pointer;
  font-family:var(--display);font-weight:600;font-size:.88rem;color:var(--ink);
  box-shadow:0 12px 30px rgba(43,34,51,.2);
  transition:transform 170ms ease;
}
#helper.on{display:flex}
#helper:hover{transform:translateY(-3px)}
#helper img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:rgba(43,34,51,.08)}
#helper:focus-visible{outline:3px solid var(--route);outline-offset:3px}

@media (max-width:640px){
  .meet{flex-direction:column;gap:1rem}
  .bubble{border-radius:22px 22px 22px 22px;max-width:34ch;text-align:center}
  .bubble::before{left:50%;top:-9px;bottom:auto;translate:-50% 0;border-radius:6px 0 0 0}
  .greeter-anim .bubble{transform-origin:50% 0}
  .nav{width:100%;margin-left:0;order:3;justify-content:space-between;gap:.35rem}
  .topbar{flex-wrap:wrap}
}
</style>
</head>
<body class="locked">

<div id="greeter" class="greeter-anim" role="dialog" aria-modal="true" aria-labelledby="ask">
  <div class="blobs" aria-hidden="true"></div>
  <div class="confetti" aria-hidden="true"></div>
  <div id="tint" aria-hidden="true"></div>
  <div id="spot" aria-hidden="true"></div>
  <video id="intro" src="Website_02.mp4" playsinline preload="auto" aria-hidden="true"></video>
  <div id="vpick" role="group" aria-label="Intro video"><button type="button" data-v="Website_02.mp4" aria-pressed="true">New video</button><button type="button" data-v="Website_01.mp4" aria-pressed="false">Old video</button></div>
  <button id="sound" type="button">&#128263; Tap for sound</button>
  <div id="scrim" aria-hidden="true"></div>

/* ---------- intro video ---------- */
/* question + chips stay hidden until the video has played to its last frame */
const intro=document.getElementById('intro');
function showQuestion(){
  if(greeter.classList.contains('ready')) return;
  intro.pause();
  sound.classList.remove('on');
  greeter.classList.add('ready');
  chips[0].focus({preventScroll:true});
}

/* try with sound first; browsers usually refuse that before the visitor has interacted,
   so fall back to muted playback and offer a one-tap unmute */
function playIntro(){
  intro.play().catch(()=>{
    intro.muted=true;
    sound.classList.add('on');
    /* even muted autoplay can be refused (data saver, low-power mode): don't strand the visitor */
    return intro.play().catch(showQuestion);
  });
}
/* temporary old/new switch; ?video=old or ?video=new also works, and the last pick is remembered */

  if(intro.getAttribute('src')!==src) intro.src=src;
  try{ localStorage.setItem('kz-intro-video',src); }catch(e){}
}
{

  let saved=null; try{ saved=localStorage.getItem('kz-intro-video'); }catch(e){}
  const start=q?(q==='old'?'Website_01.mp4':'Website_02.mp4'):saved;

  greeter.classList.remove('ready');
  playIntro();
}));

/* pointer spotlight, heavily lerped so it trails the cursor */
if(matchMedia('(pointer:fine)').matches && !reduce.matches){
  let tx=innerWidth/2, ty=innerHeight/2, cx=tx, cy=ty, raf=0;
  const place=()=>{spot.style.transform=`translate3d(${cx.toFixed(1)}px,${cy.toFixed(1)}px,0)`};
  const tick=()=>{
    cx+=(tx-cx)*.06; cy+=(ty-cy)*.06; place();
    raf=(Math.abs(tx-cx)>.5||Math.abs(ty-cy)>.5)?requestAnimationFrame(tick):0;
  };
  place();
  addEventListener('pointermove',e=>{
    if(site.classList.contains('on')) return;   /* greeter is gone, stop spending frames */
    tx=e.clientX; ty=e.clientY;
    if(!raf) raf=requestAnimationFrame(tick);
  },{passive:true});
}

/* ---------- build the tunnel ---------- */
const DEPTH=6200, TRAVEL=DEPTH+1100;
/* actual perspective depth in px, so lateral spread can be depth-corrected */
const PERSP=parseFloat(getComputedStyle(tunnel).perspective)||460;
const LAYERS=[
  {el:document.getElementById('lnear'), speed:0.78},
  {el:document.getElementById('lmid'),  speed:1.00},
  {el:document.getElementById('lfar'),  speed:1.34}
];
const [NEAR,MID,FAR]=LAYERS.map(l=>l.el);

/* Lateral spread must grow with depth or everything collapses onto the vanishing
   point, because perspective divides the offset by (P+z)/P. */
const spreadAt=(z,base)=>Math.min(210,base*Math.pow(1+z/PERSP,.82));
const layerFor=z=>z>DEPTH*.62?FAR:z>DEPTH*.30?MID:NEAR;
const sizeVmin=(el,d)=>{
  el.style.width=d.toFixed(1)+'vmin'; el.style.height=d.toFixed(1)+'vmin';
  el.style.margin=(-d/2).toFixed(1)+'vmin 0 0 '+(-d/2).toFixed(1)+'vmin';
};
const placeAt=(el,z,base,extra)=>{
  const s=spreadAt(z,base);
  el.style.transform='translate3d('+rnd(-s,s).toFixed(1)+'vmin,'+rnd(-s,s).toFixed(1)+'vmin,'+
                     (-z).toFixed(0)+'px)'+(extra||'');
};
/* place on a ring at a minimum radius, so cloud frames the flight path instead of
   sitting in front of it and fogging out the toys */
const placeRadial=(el,z,minR,maxR)=>{
  const k=spreadAt(z,1), a=Math.random()*Math.PI*2, r=rnd(minR,maxR)*k;
  el.style.transform='translate3d('+(Math.cos(a)*r).toFixed(1)+'vmin,'+
                     (Math.sin(a)*r).toFixed(1)+'vmin,'+(-z).toFixed(0)+'px)';
};

/* soft light rings receding to the vanishing point - the structure that says
   "you are moving through something", rendered as glow rather than geometry */
for(let i=0;i<9;i++){
  const t=i/8;
  const hl=document.createElement('div');
  hl.className='halo';
  const z=320+(DEPTH-320)*Math.pow(t,1.1);
  sizeVmin(hl,(56+20*t)*Math.pow(1+z/PERSP,.72));
  hl.style.setProperty('--pc','color-mix(in srgb, var(--route) '+Math.round(72-40*t)+'%, rgba(255,255,255,.85))');
  hl.style.opacity=(0.34-0.16*t).toFixed(2);
  hl.style.transform='translateZ('+(-z).toFixed(0)+'px)';
  MID.appendChild(hl);
}

/* soft cloud you drift through, weighted towards the far end so the near field
   stays open and the toys stay readable */
for(let i=0;i<14;i++){
  const p=document.createElement('div');
  p.className='puff';
  const z=200+(DEPTH-200)*Math.pow(Math.random(),.8);
  sizeVmin(p,rnd(22,46)*Math.pow(1+z/PERSP,.5));
  p.style.setProperty('--pc','color-mix(in srgb, '+BRAND[i%BRAND.length]+' 30%, rgba(255,255,255,.88))');
  p.style.opacity=rnd(.16,.38).toFixed(2);
  placeRadial(p,z,17,40);
  layerFor(z).appendChild(p);
}

/* defocused colour dots scattered right through the depth */
for(let i=0;i<32;i++){
  const b=document.createElement('div');
  b.className='bokeh';
  const z=rnd(.05,1.05)*DEPTH;
  sizeVmin(b,rnd(6,19)*Math.pow(1+z/PERSP,.55));
  b.style.setProperty('--pc','color-mix(in srgb, '+BRAND[(i*5)%BRAND.length]+' 52%, #fff)');
  b.style.opacity=rnd(.22,.50).toFixed(2);
  placeAt(b,z,34);
  layerFor(z).appendChild(b);
}

/* The playthings are the point of the scene, so there are more of them, they run
   bigger, and they tumble slowly rather than spinning. Three depth tiers at
   different speeds keep objects arriving for the whole flight instead of all
   rushing past in the first fifth. */
const TOY_TIERS=[
  {layer:NEAR, n:14, zMin:.03, zMax:.32},
  {layer:MID,  n:18, zMin:.32, zMax:.68},
  {layer:FAR,  n:20, zMin:.68, zMax:1.04}
];
let toyN=0;
TOY_TIERS.forEach(({layer,n,zMin,zMax})=>{
  for(let i=0;i<n;i++,toyN++){
    const t=document.createElement('div');
    t.className='toy';
    const inner=document.createElement('i');
    inner.innerHTML=TOYS[toyN%TOYS.length](BRAND[(toyN*5)%BRAND.length]);
    inner.style.animationDuration=rnd(7,17).toFixed(1)+'s';
    inner.style.animationDirection=Math.random()<.5?'normal':'reverse';
    t.appendChild(inner);
    const z=rnd(zMin,zMax)*DEPTH;
    placeAt(t,z,24,' rotate('+(Math.random()*360).toFixed(0)+'deg) scale('+rnd(.9,2.0).toFixed(2)+')');
    layer.appendChild(t);
  }
});

/* soft light shafts, not hard speed lines */
for(let i=0;i<14;i++){
  const s=document.createElement('i');
  const th=rnd(10,26);
  s.style.cssText='width:'+rnd(16,44).toFixed(1)+'vmin;height:'+th.toFixed(1)+'px;'+
    'margin-top:'+(-th/2).toFixed(1)+'px;'+
    'background:linear-gradient(90deg, transparent 0%, '+BRAND[i%BRAND.length]+' 55%, transparent 100%);'+
    'opacity:'+rnd(.12,.30).toFixed(2)+';'+
    'transform:rotate('+(i/14*360+rnd(-10,10)).toFixed(1)+'deg) translateX('+rnd(14,40).toFixed(1)+'vmin)';
  streaks.appendChild(s);
}

/* ---------- chips + nav ---------- */
ORDER.forEach((k,i)=>{

  chip.style.setProperty('--i',i);

  options.appendChild(chip);

  const b=document.createElement('button');
  b.dataset.nav=k; b.style.setProperty('--c',r.hex); b.textContent=r.nav;

/* hovering a chip tints the whole greeter towards where that chip goes */
const previewTo=hex=>{ if(!busy) root.style.setProperty('--preview',hex); };
chips.forEach(c=>{
  const on =()=>previewTo(ROUTES[c.dataset.go].hex);
  const off=()=>previewTo(current?ROUTES[current].hex:ROUTES[ORDER[0]].hex);
  c.addEventListener('mouseenter',on);
  c.addEventListener('focus',on);
  c.addEventListener('mouseleave',off);
  c.addEventListener('blur',off);
});

/* roving tabindex: one tab stop, arrows move between chips */
options.addEventListener('keydown',e=>{
  const i=chips.indexOf(document.activeElement);
  if(i<0) return;
  let n=null;
  if(e.key==='ArrowRight'||e.key==='ArrowDown') n=(i+1)%chips.length;
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp') n=(i-1+chips.length)%chips.length;
  else if(e.key==='Home') n=0;
  else if(e.key==='End') n=chips.length-1;
  if(n===null) return;
  e.preventDefault();
  chips[i].tabIndex=-1; chips[n].tabIndex=0; chips[n].focus();
});

/* ---------- render ---------- */
let current=null, busy=false, flight=null;
function render(key){
  const r=ROUTES[key];
  root.style.setProperty('--route',r.hex);
  main.innerHTML=`
    <section class="hero"><div class="hero-inner">
      <p class="eyebrow">${r.eyebrow}</p>
      <h1 tabindex="-1">${r.title}</h1>
      <p class="lede">${r.lede}</p>
      <button class="cta">${r.cta}</button>
    </div></section>
    <section class="cards">
      ${r.cards.map(c=>`<article class="card"><span class="tag">${c.tag}</span><h3>${c.h}</h3><p>${c.p}</p></article>`).join('')}
    </section>`;
  nav.querySelectorAll('button').forEach(b=>{
    if(b.dataset.nav===key) b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  });
  current=key;
}
function reveal(){
  site.classList.add('on'); helper.classList.add('on');
  greeter.style.display='none'; document.body.classList.remove('locked');
  stage.style.opacity='';
}
const focusHeading=()=>{const h=main.querySelector('h1'); if(h) h.focus({preventScroll:true});};

/* click or Escape during the flight jumps straight to the end state */
function skipFlight(){
  if(!flight) return;
  flight.skipped=true;
  flight.anims.forEach(a=>{try{a.finish()}catch(e){}});
}

/* ---------- the trip ---------- */
async function travel(key,origin){
  if(busy) return; busy=true;
  const hex=ROUTES[key].hex;
  root.style.setProperty('--route',hex);
  root.style.setProperty('--preview',hex);

  if(reduce.matches){
    await greeter.animate([{opacity:1},{opacity:0}],{duration:180,fill:'forwards'}).finished;
    return land(key);
  }

  const b=origin.getBoundingClientRect();
  greeter.style.transformOrigin=`${b.left+b.width/2}px ${b.top+b.height/2}px`;

  const OUT=380, IN=520, total=OUT+IN;
  const anims=[];
  flight={anims,skipped:false};
  const A=(el,frames,opts)=>{const a=el.animate(frames,opts);anims.push(a);return a;};

  tunnel.classList.add('live');

  A(tunnel,[{opacity:0},{opacity:1,offset:.12},{opacity:1,offset:.64},{opacity:0}],
    {duration:total,fill:'forwards'});
  /* a gentle banked drift, not a 26-degree barrel roll */
  A(roll,[{transform:'rotate(0deg) translate3d(0,0,0)'},
          {transform:'rotate(4.5deg) translate3d(-1.4vmin,.9vmin,0)',offset:.5},
          {transform:'rotate(9deg) translate3d(0,0,0)'}],
    {duration:total,easing:'cubic-bezier(.4,0,.3,1)',fill:'forwards'});
  LAYERS.forEach(({el,speed})=>
    A(el,[{transform:'translateZ(0)'},{transform:`translateZ(${Math.round(TRAVEL*speed)}px)`}],
      {duration:total,easing:'cubic-bezier(.36,.06,.24,1)',fill:'forwards'}));
  /* The flare is held at zero through the first third so it reads as arrival
     instead of washing out the tunnel while you are still travelling.
     Overall easing is linear here on purpose: a non-linear option easing warps
     where keyframe offsets land in time, which is what fired these far too early. */
  A(streaks,[{transform:'scale(.6)',opacity:0,easing:'ease-in'},
             {transform:'scale(.95)',opacity:.12,offset:.2,easing:'ease-out'},
             {transform:'scale(1.6)',opacity:.95,offset:.52,easing:'ease-in'},
             {transform:'scale(3.1)',opacity:0}],
    {duration:total,easing:'linear'});
  A(glow,[{transform:'scale(.14)',opacity:0,easing:'ease-in'},
          {transform:'scale(.45)',opacity:0,offset:.3,easing:'ease-out'},
          {transform:'scale(1)',opacity:1,offset:.62,easing:'ease-in'},
          {transform:'scale(3)',opacity:0}],
    {duration:total,easing:'linear'});
  A(bloom,[{transform:'scale(.24)',opacity:0,easing:'ease-in'},
           {transform:'scale(.5)',opacity:0,offset:.36,easing:'ease-out'},
           {transform:'scale(1.4)',opacity:.9,offset:.66,easing:'ease-in'},
           {transform:'scale(3.2)',opacity:0}],
    {duration:total,easing:'linear'});
  A(flash,[{transform:'scale(.5)',opacity:0,easing:'ease-in'},
           {transform:'scale(.72)',opacity:0,offset:.4,easing:'ease-out'},
           {transform:'scale(1.15)',opacity:1,offset:.66,easing:'ease-in'},
           {transform:'scale(2.4)',opacity:0,offset:.9},
           {transform:'scale(2.6)',opacity:0}],
    {duration:total,easing:'linear'});

  /* no filter:brightness here - a filter on this subtree repaints two decoded
     images every frame; the bloom above carries the same read for free */
  await A(greeter,[{transform:'scale(1)',opacity:1},{transform:'scale(4.1)',opacity:0}],
    {duration:OUT,easing:'cubic-bezier(.5,0,.75,.4)',fill:'forwards'}).finished;

  greeter.style.display='none';
  /* let the tunnel finish its flare, then arrive on the real page */
  await Promise.all(anims.map(a=>a.finished.catch(()=>{})));
  land(key);
}

/* hand over to the destination page; it eases itself in when it sees the flag.
   replace() keeps the intro out of history, so Back never lands on it again */
function land(key){
  try{ sessionStorage.setItem('kz-arrive','1'); }catch(e){}
  location.replace(ROUTES[key].href);
}

/* coming Back from a page restores this one from the back/forward cache
   mid-flight: put the question back on screen */
addEventListener('pageshow',e=>{
  if(!e.persisted) return;
  busy=false; flight=null;
  tunnel.classList.remove('live');
  [tunnel,roll,streaks,glow,bloom,flash,greeter,...LAYERS.map(l=>l.el)]
    .forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
  greeter.style.display=''; greeter.style.transform=''; greeter.style.opacity='';
  document.body.classList.add('locked');
  showQuestion();
});

/* inside the site, navigation is ordinary */
async function goPlain(key){
  if(busy||key===current) return; busy=true;
  await main.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(10px)'}],
    {duration:150,fill:'forwards'}).finished;
  render(key); window.scrollTo(0,0);
  await main.animate([{opacity:0,transform:'translateY(-10px)'},{opacity:1,transform:'translateY(0)'}],
    {duration:250,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'}).finished;
  main.getAnimations().forEach(a=>a.cancel()); busy=false;
}

function reopen(){
  if(busy) return;
  site.classList.remove('on'); helper.classList.remove('on');
  greeter.style.display=''; greeter.style.transform=''; greeter.style.opacity='';
  greeter.getAnimations().forEach(a=>a.cancel());
  document.body.classList.add('locked');
  root.style.setProperty('--preview',current?ROUTES[current].hex:ROUTES[ORDER[0]].hex);
  /* replay the entrance */
  greeter.classList.remove('greeter-anim'); void greeter.offsetWidth; greeter.classList.add('greeter-anim');
  chips.forEach((c,i)=>c.tabIndex=i?-1:0);
  chips[0].focus({preventScroll:true});
}

document.addEventListener('click',e=>{
  if(busy){ if(tunnel.classList.contains('live')) skipFlight(); return; }
  const chip=e.target.closest('[data-go]'); if(chip) return travel(chip.dataset.go,chip);
  const nb=e.target.closest('[data-nav]'); if(nb) return goPlain(nb.dataset.nav);
  if(e.target.closest('[data-skip]')) return land('exploring');
  if(e.target.closest('[data-redig]')||e.target.closest('.redig')) return reopen();
});

document.addEventListener('keydown',e=>{
  if(busy){ if(e.key==='Escape'&&tunnel.classList.contains('live')) skipFlight(); return; }
  if(site.classList.contains('on')) return;
  /* during the intro, Escape jumps to the question; nothing else fires */
  if(!greeter.classList.contains('ready')){ if(e.key==='Escape') showQuestion(); return; }
  if(e.key==='Escape') return land('exploring');
  /* 1-5 jump straight to a route */
  const n=parseInt(e.key,10);
  if(n>=1&&n<=ORDER.length){ const c=chips[n-1]; c.focus({preventScroll:true}); travel(c.dataset.go,c); }
});
</script>
</body>
